name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Django · PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orvanta_ci
          POSTGRES_USER: orvanta_ci
          POSTGRES_PASSWORD: orvanta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orvanta_ci -d orvanta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Disposable CI credentials; no repository or deployment secrets are needed.
      SECRET_KEY: orvanta-ci-only-not-a-production-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://orvanta_ci:orvanta_ci@localhost:5432/orvanta_ci
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
          python -m pip install -r ../requirements.txt

      - name: Compile translations
        run: python manage.py compilemessages

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.test_postgres_settings

      - name: Collect production static files
        run: python manage.py collectstatic --noinput --settings=config.settings

      - name: Run all tests, including concurrent booking
        run: python manage.py test --settings=config.test_postgres_settings --noinput
